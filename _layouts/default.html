<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header>
    <a class="mark" href="{{ '/' | relative_url }}">3<span class="point">.</span>00</a>
    <nav>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/delete-account/' | relative_url }}">Delete account</a>
      <a href="{{ '/support/' | relative_url }}">Support</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>{{ site.title }} is published by {{ site.publisher }}. Contact: <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></p>
  </footer>
</body>
</html>
